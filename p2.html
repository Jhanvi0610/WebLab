
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program-3</title>

    <style>
        p {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <p id="demo"></p>

    <script>
        var font_size = 5;
        var p = document.getElementById("demo");

        var grow = setInterval(growing, 1000);

        function growing() {
            p.innerHTML = "TEXT GROWING";

            p.setAttribute("style",
                "font-size:" + font_size + "px; color:red"
            );

            font_size += 5;

            if (font_size >= 50) {
                clearInterval(grow);
                var shrink = setInterval(shrinking, 1000);
            }
        }

        function shrinking() {
             p.innerHTML = "TEXT SHRINKING";
            font_size -= 5;

            p.setAttribute("style",
                "font-size:" + font_size + "px; color:blue"
            );

            if (font_size === 5) {
                clearInterval(shrink);
                grow = setInterval(growing, 1000);
            }
        }
    </script>

</body>
</html>
